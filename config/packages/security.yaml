security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
            logout:
                path: logout
                target: home
                enable_csrf: true
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
    access_control:
        - { route: login, roles: PUBLIC_ACCESS }
        - { route: logout, roles: PUBLIC_ACCESS }
        - { route: home, roles: PUBLIC_ACCESS }
        - { route: guests, roles: PUBLIC_ACCESS }
        - { route: guest, roles: PUBLIC_ACCESS }
        - { route: portfolio, roles: PUBLIC_ACCESS }
        - { route: about, roles: PUBLIC_ACCESS }

        - { route: admin_album_index, roles: ROLE_ADMIN }
        - { route: admin_album_add, roles: ROLE_ADMIN }
        - { route: admin_album_update, roles: ROLE_ADMIN }
        - { route: admin_album_delete, roles: ROLE_ADMIN }
        - { route: admin_media_index, roles: ROLE_ADMIN }
        - { route: admin_media_add, roles: ROLE_ADMIN }
        - { route: admin_media_delete, roles: ROLE_ADMIN }

        # deny everything else
        - { path: ^/, roles: ROLE_DENIED }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
